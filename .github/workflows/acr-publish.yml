name: Build and Push to ACR
run-name: ACR ${{ inputs.image_tag }} (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (latest is also updated)"
        required: true
        type: string

permissions:
  contents: read

# Serialize publications because every successful run updates latest.
concurrency:
  group: acr-publish-${{ github.repository }}
  cancel-in-progress: false

env:
  ACR_REGISTRY: crpi-pmwtbactowtr55vh.cn-beijing.personal.cr.aliyuncs.com
  ACR_IMAGE: crpi-pmwtbactowtr55vh.cn-beijing.personal.cr.aliyuncs.com/qwe5283/9router

jobs:
  publish:
    name: Build, test, and publish linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out selected source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate image tag and read application version
        id: metadata
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.IMAGE_TAG || "";
          if (tag.length > 128 || !/^[A-Za-z0-9_]/.test(tag) || /[^A-Za-z0-9_.-]/.test(tag)) {
            console.error("Image tag must be 1–128 characters: start with a letter, digit, or underscore; use only letters, digits, underscores, dots, and hyphens.");
            process.exit(1);
          }

          const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (typeof version !== "string" || !version || /[^A-Za-z0-9_.+-]/.test(version)) {
            console.error("package.json must contain a valid application version.");
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `image_tag=${tag}\napp_version=${version}\n`);
          console.log(`Publishing image tag ${tag} from application version ${version}`);
          NODE

      - name: Check ACR credentials
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ACR_USERNAME" || -z "$ACR_PASSWORD" ]]; then
            echo "::error::Configure the ACR_USERNAME and ACR_PASSWORD repository secrets."
            exit 1
          fi

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.ACR_IMAGE }}:${{ steps.metadata.outputs.image_tag }}
            ${{ env.ACR_IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.app_version }}
            BUILD_NODE_OPTIONS=--max-old-space-size=8192
            ALPINE_MIRROR=${{ vars.ALPINE_MIRROR || 'dl-cdn.alpinelinux.org' }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org/' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.app_version }}
          cache-from: type=gha,scope=9router-acr-amd64
          cache-to: type=gha,mode=max,scope=9router-acr-amd64
          provenance: false
          sbom: false

      - name: Smoke-test image before publishing
        timeout-minutes: 5
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          set -Eeuo pipefail
          image="${ACR_IMAGE}:${IMAGE_TAG}"
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
          if [[ "$platform" != "linux/amd64" ]]; then
            echo "::error::Expected linux/amd64 image, received ${platform}"
            exit 1
          fi

          container="9router-acr-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach \
            --name "$container" \
            --platform linux/amd64 \
            --publish 127.0.0.1:20128:20128 \
            "$image"

          for attempt in {1..45}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:20128/api/health; then
              echo "Image health check passed"
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]]; then
              break
            fi
            if (( attempt % 5 == 0 )); then
              echo "Waiting for image health check (${attempt}/45)" >&2
            fi
            sleep 2
          done

          echo "::error::Image health check failed; container logs follow."
          docker logs "$container" || true
          exit 1

      - name: Push image tag and latest
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker push "${ACR_IMAGE}:${IMAGE_TAG}"
          if [[ "$IMAGE_TAG" != "latest" ]]; then
            docker push "${ACR_IMAGE}:latest"
          fi

      - name: Verify published manifests
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${ACR_IMAGE}:${IMAGE_TAG}"
          docker buildx imagetools inspect "${ACR_IMAGE}:latest"
          docker buildx imagetools inspect --raw "${ACR_IMAGE}:${IMAGE_TAG}" > "$RUNNER_TEMP/acr-version-manifest.json"
          docker buildx imagetools inspect --raw "${ACR_IMAGE}:latest" > "$RUNNER_TEMP/acr-latest-manifest.json"
          if ! cmp -s "$RUNNER_TEMP/acr-version-manifest.json" "$RUNNER_TEMP/acr-latest-manifest.json"; then
            echo "::error::The requested tag and latest do not reference the same manifest."
            exit 1
          fi

      - name: Write publication summary
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: |
          {
            printf '### ACR image published\n\n'
            printf -- '- Image: `%s:%s`\n' "$ACR_IMAGE" "$IMAGE_TAG"
            printf -- '- Latest: `%s:latest`\n' "$ACR_IMAGE"
            printf -- '- Platform: `linux/amd64`\n'
            printf -- '- Application version: `%s`\n' "$APP_VERSION"
            printf -- '- Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf '```sh\ndocker pull %s:%s\n```\n' "$ACR_IMAGE" "$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
